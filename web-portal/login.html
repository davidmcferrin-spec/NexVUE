<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Sign in</title>
<link rel="stylesheet" href="/nexvue/assets/nexapp-tokens.css">
<link rel="stylesheet" href="/assets/nexapp-theme.css">
<link rel="stylesheet" href="/nexvue/assets/nexvue-portal.css">
<script>
(function () {
  var t = localStorage.getItem("nexapp-theme") || "system";
  var r = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
  document.documentElement.setAttribute("data-theme", r);
  document.documentElement.setAttribute("data-theme-pref", t);
})();
</script>
<script src="/assets/theme.js" defer></script>
<script src="/nexvue/assets/nexvue-ui.js"></script>
<style>
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .card { width: 100%; max-width: 400px; }
  .theme-toggle { position: fixed; top: 12px; right: 12px; }
</style>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle">Theme</button>
<div class="card">
  <h1>NexVUE</h1>
  <p class="sub" id="subtitle">Sign in with NexAPP to open the station catalog.</p>
  <p><a class="ch-btn" id="nexapp-link" href="https://nexapp.nexstar.tv/login.php?return=/nexvue/">Continue with NexAPP</a></p>
  <div id="login-box" hidden>
    <form id="login-form" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in (test)</button>
      <div class="err" id="login-err"></div>
    </form>
  </div>
</div>
<script src="/nexvue/assets/nexvue-portal-auth-gate.js"></script>
<script>
(function () {
  var themeBtn = document.getElementById("theme-toggle");
  if (themeBtn) themeBtn.addEventListener("click", function () {
    if (window.NexAppTheme) window.NexAppTheme.cycle();
  });
  var params = new URLSearchParams(location.search);
  var next = params.get("next") || "/nexvue/catalog";
  if (next.indexOf("/") === 0 && next.indexOf("//") !== 0) {
    document.getElementById("nexapp-link").href =
      "https://nexapp.nexstar.tv/login.php?return=" + encodeURIComponent(next.indexOf("/nexvue") === 0 ? next : "/nexvue" + next);
  }
  NexVuePortal.api("me").then(function () {
    location.href = next.indexOf("/nexvue") === 0 ? next : "/nexvue/catalog";
  }).catch(function () {});
})();
</script>
</body>
</html>
