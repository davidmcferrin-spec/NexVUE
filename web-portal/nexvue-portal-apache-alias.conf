# NexVUE as a NexAPP Alias service at /nexvue.
# setup.sh --portal substitutes @@APP_ROOT@@ (parent of public/).
# Install into conf-available so NexAPP's generated vhost (Alias+Directory
# only) does not wipe Rewrite/API routing. Operator still adds
# service_docroots['/nexvue'] in NexAPP config and Rescans.
#
# Requires: a2enmod rewrite alias.

Alias /nexvue "@@APP_ROOT@@/public"

<Directory "@@APP_ROOT@@/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    RewriteEngine On
    RewriteBase /nexvue/
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ index.php [L]
</Directory>
