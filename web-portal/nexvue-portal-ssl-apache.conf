# NexVUE cloud portal TLS — default cert/key for all SSL vhosts unless a
# site overrides SSLCertificateFile / SSLCertificateKeyFile.
# setup.sh --portal installs to /etc/apache2/conf-available/nexvue-portal-ssl-certs.conf
# and a2enconf's it. Certs live under /etc/nexvue-portal/tls/ — deliberately
# separate from an edge node's /etc/nexvue/tls/ (this is always a different
# box, but keeping the paths distinct avoids any ambiguity if that ever changes).

<IfModule mod_ssl.c>
    SSLCertificateFile      /etc/nexvue-portal/tls/fullchain.pem
    SSLCertificateKeyFile   /etc/nexvue-portal/tls/privkey.pem
</IfModule>
