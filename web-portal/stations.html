<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Stations</title>
<link rel="stylesheet" href="/nexvue/assets/nexapp-tokens.css">
<link rel="stylesheet" href="/assets/nexapp-theme.css">
<link rel="stylesheet" href="/nexvue/assets/nexvue-portal.css">
<script>
(function () {
  var t = localStorage.getItem("nexapp-theme") || "system";
  var r = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
  document.documentElement.setAttribute("data-theme", r);
})();
</script>
<script src="/assets/theme.js" defer></script>
<script src="/nexvue/assets/nexvue-ui.js"></script>
<style>
  .token-box { background: var(--bg); border: 1px solid var(--acc); border-radius: 4px; padding: 10px; margin-top: 10px; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="apps-link" href="/portal.php">Apps</a>
  <a class="brand" href="/nexvue/catalog">NexVUE</a>
  <a href="/nexvue/catalog">Catalog</a>
  <a href="/nexvue/stations" class="active">Stations</a>
  <a href="/nexvue/users">Access</a>
  <span class="spacer"></span>
  <span id="nav-who" hidden></span>
  <a href="#" id="nav-logout" hidden>Sign out</a>
  <button type="button" class="theme-toggle" id="theme-toggle">Theme</button>
</nav>
<main>
  <h1>Stations</h1>
  <p class="meta">Health is last heartbeat from the node (outbound). This portal never probes an edge.</p>
  <div class="panel">
    <div id="stations"><p class="empty">Loading…</p></div>
  </div>

  <h1>Adopt a station</h1>
  <div class="panel">
    <p class="meta">Generates a one-time enrollment code. Paste it into the edge Settings → Adopt this station form.</p>
    <form id="token-form">
      <input id="station-name" placeholder="Station name (e.g. Studio A)" required>
      <button type="submit">Generate code</button>
    </form>
    <div class="err" id="token-err"></div>
    <div class="token-box" id="token-box" style="display:none;"></div>
  </div>
</main>
<script src="/nexvue/assets/nexvue-portal-auth-gate.js"></script>
<script>
(function () {
  function renderStations(stations) {
    const el = document.getElementById("stations");
    if (!stations.length) {
      el.innerHTML = '<p class="empty">No stations adopted yet.</p>';
      return;
    }
    const table = document.createElement("table");
    table.innerHTML = "<tr><th>Name</th><th>Health</th><th>Edge URL</th><th>Version</th><th>Last heartbeat</th><th>Channels</th><th></th></tr>";
    for (const s of stations) {
      const tr = document.createElement("tr");
      const health = s.health || "unknown";
      const cls = health === "ok" ? "ok-dot" : (health === "down" ? "bad-dot" : "warn-dot");
      tr.innerHTML =
        "<td>" + escapeHtml(s.name) + "</td>" +
        "<td><span class=\"" + cls + "\">●</span> " + escapeHtml(health) + "</td>" +
        "<td>" + escapeHtml(s.edge_base_url) + "</td>" +
        "<td>" + escapeHtml(s.edge_version || "—") + "</td>" +
        "<td>" + escapeHtml(s.last_heartbeat_at || "never") + "</td>" +
        "<td>" + (s.channels || []).length + "</td>" +
        "<td><button type=\"button\" class=\"secondary sso\" data-id=\"" + escapeHtml(s.id) + "\">Open station UI</button></td>";
      table.appendChild(tr);
    }
    el.textContent = "";
    el.appendChild(table);
    el.querySelectorAll("button.sso").forEach(function (btn) {
      btn.addEventListener("click", function () {
        NexVuePortal.stationSso(btn.getAttribute("data-id")).then(function (data) {
          window.open(data.login_url, "_blank", "noopener");
        }).catch(function (e) { alert(e.message || "SSO failed"); });
      });
    });
  }

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function loadStations() {
    return NexVuePortal.api("stations_list").then(function (data) {
      renderStations(data.stations || []);
    });
  }

  NexVuePortal.requirePage({ roles: ["org_admin"] }).then(function () {
    loadStations();
  });

  document.getElementById("token-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    const err = document.getElementById("token-err");
    err.textContent = "";
    const name = document.getElementById("station-name").value;
    try {
      const data = await NexVuePortal.api("enroll_token_create", { name: name });
      const box = document.getElementById("token-box");
      box.style.display = "block";
      box.textContent = "Enrollment code (expires " + data.expires_at + "):\n" + data.token;
      document.getElementById("station-name").value = "";
      loadStations();
    } catch (e) {
      err.textContent = e.message || "failed";
    }
  });
})();
</script>
</body>
</html>
