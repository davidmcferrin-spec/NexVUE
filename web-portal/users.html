<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Access</title>
<link rel="stylesheet" href="/nexvue/assets/nexapp-tokens.css">
<link rel="stylesheet" href="/assets/nexapp-theme.css">
<link rel="stylesheet" href="/nexvue/assets/nexvue-portal.css">
<script>
(function () {
  var t = localStorage.getItem("nexapp-theme") || "system";
  var r = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
  document.documentElement.setAttribute("data-theme", r);
})();
</script>
<script src="/assets/theme.js" defer></script>
<script src="/nexvue/assets/nexvue-ui.js"></script>
<style>
  form.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chk-list { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0; font-size: 13px; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="apps-link" href="/portal.php">Apps</a>
  <a class="brand" href="/nexvue/catalog">NexVUE</a>
  <a href="/nexvue/catalog">Catalog</a>
  <a href="/nexvue/stations">Stations</a>
  <a href="/nexvue/users" class="active">Access</a>
  <span class="spacer"></span>
  <span id="nav-who" hidden></span>
  <a href="#" id="nav-logout" hidden>Sign out</a>
  <button type="button" class="theme-toggle" id="theme-toggle">Theme</button>
</nav>
<main>
  <h1>NexAPP groups</h1>
  <p class="meta">NexAPP User/Admin is the catalog ceiling. Map a granted group to stations and channels; that bundle is pushed on the next node heartbeat. Never maps to station admin.</p>
  <div class="panel">
    <div id="groups"><p class="empty">Loading…</p></div>
  </div>

  <h1>Map group → station</h1>
  <div class="panel">
    <form id="acl-form" class="row">
      <select id="acl-group"></select>
      <select id="acl-station"></select>
      <select id="acl-role">
        <option value="viewer">edge viewer</option>
        <option value="operator">edge operator</option>
        <option value="sharer">edge sharer</option>
      </select>
      <button type="submit">Save mapping</button>
    </form>
    <label><input type="checkbox" id="acl-all" checked> All channels on this station</label>
    <div class="chk-list" id="acl-channels"></div>
    <div class="err" id="acl-err"></div>
    <div class="ok-msg" id="acl-ok"></div>
  </div>
</main>
<script src="/nexvue/assets/nexvue-portal-auth-gate.js"></script>
<script>
(function () {
  let groupsCache = [];
  let stationsCache = [];

  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function renderGroups(groups, acl) {
    const el = document.getElementById("groups");
    if (!groups.length) {
      el.innerHTML = '<p class="empty">No NexAPP groups granted to NexVUE yet (or directory unavailable).</p>';
      return;
    }
    const table = document.createElement("table");
    table.innerHTML = "<tr><th>Group</th><th>Catalog</th><th>Members</th><th>Station maps</th></tr>";
    groups.forEach(function (g) {
      const maps = (acl || []).filter(function (a) { return a.nexapp_group_id === g.id; });
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + escapeHtml(g.name) + "</td>" +
        "<td>" + escapeHtml(g.catalog_role) + "</td>" +
        "<td>" + (g.members || []).length + "</td>" +
        "<td>" + (maps.length ? maps.map(function (m) {
          return escapeHtml(m.station_id.slice(0, 8)) + " " + escapeHtml(m.edge_role) +
            (m.channel_base ? " " + m.channel_base : " all");
        }).join("; ") : "—") + "</td>";
      table.appendChild(tr);
    });
    el.textContent = "";
    el.appendChild(table);
  }

  function populate() {
    const groupSel = document.getElementById("acl-group");
    groupSel.textContent = "";
    groupsCache.forEach(function (g) {
      const opt = document.createElement("option");
      opt.value = g.id;
      opt.textContent = g.name + " (" + g.catalog_role + ")";
      opt.dataset.name = g.name;
      groupSel.appendChild(opt);
    });
    const stationSel = document.getElementById("acl-station");
    stationSel.textContent = "";
    stationsCache.forEach(function (s) {
      const opt = document.createElement("option");
      opt.value = s.id;
      opt.textContent = s.name;
      stationSel.appendChild(opt);
    });
    renderAclChannels();
  }

  function renderAclChannels() {
    const stationId = document.getElementById("acl-station").value;
    const station = stationsCache.find(function (s) { return s.id === stationId; });
    const box = document.getElementById("acl-channels");
    box.textContent = "";
    if (!station) return;
    (station.channels || []).forEach(function (ch) {
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.value = ch.channel_base;
      label.appendChild(cb);
      label.appendChild(document.createTextNode(" " + (ch.alias || ch.channel_base)));
      box.appendChild(label);
    });
  }

  function loadAll() {
    return Promise.all([
      NexVuePortal.api("nexapp_groups"),
      NexVuePortal.api("stations_list"),
    ]).then(function (results) {
      groupsCache = results[0].groups || [];
      stationsCache = results[1].stations || [];
      renderGroups(groupsCache, results[0].acl || []);
      populate();
    });
  }

  NexVuePortal.requirePage({ roles: ["org_admin"] }).then(function () {
    loadAll();
  });

  document.getElementById("acl-station").addEventListener("change", renderAclChannels);
  document.getElementById("acl-all").addEventListener("change", function () {
    document.getElementById("acl-channels").hidden = document.getElementById("acl-all").checked;
  });

  document.getElementById("acl-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    const err = document.getElementById("acl-err");
    const ok = document.getElementById("acl-ok");
    err.textContent = "";
    ok.textContent = "";
    const groupSel = document.getElementById("acl-group");
    const groupId = groupSel.value;
    const groupName = groupSel.options[groupSel.selectedIndex] ? groupSel.options[groupSel.selectedIndex].dataset.name : "";
    const stationId = document.getElementById("acl-station").value;
    const all = document.getElementById("acl-all").checked;
    const channels = all ? null : Array.from(document.querySelectorAll("#acl-channels input:checked")).map(function (cb) {
      return cb.value;
    });
    if (!groupId || !stationId) {
      err.textContent = "select a group and a station";
      return;
    }
    try {
      await NexVuePortal.api("group_acl_put", {
        nexapp_group_id: groupId,
        nexapp_group_name: groupName,
        station_id: stationId,
        edge_role: document.getElementById("acl-role").value,
        channels: channels,
      });
      ok.textContent = "Saved. Nodes pick this up on the next heartbeat.";
      loadAll();
    } catch (e) {
      err.textContent = e.message || "failed";
    }
  });
})();
</script>
</body>
</html>
