<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Catalog</title>
<link rel="stylesheet" href="/nexvue/assets/nexapp-tokens.css">
<link rel="stylesheet" href="/assets/nexapp-theme.css">
<link rel="stylesheet" href="/nexvue/assets/nexvue-portal.css">
<script>
(function () {
  var t = localStorage.getItem("nexapp-theme") || "system";
  var r = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
  document.documentElement.setAttribute("data-theme", r);
})();
</script>
<script src="/assets/theme.js" defer></script>
<script src="/nexvue/assets/nexvue-ui.js"></script>
</head>
<body>
<nav class="topnav">
  <a class="apps-link" href="/portal.php">Apps</a>
  <a class="brand" href="/nexvue/catalog">NexVUE</a>
  <a href="/nexvue/catalog" class="active">Catalog</a>
  <a href="/nexvue/stations" data-auth-role="org_admin" hidden>Stations</a>
  <a href="/nexvue/users" data-auth-role="org_admin" hidden>Access</a>
  <span class="spacer"></span>
  <span id="nav-who" hidden></span>
  <a href="#" id="nav-logout" hidden>Sign out</a>
  <button type="button" class="theme-toggle" id="theme-toggle">Theme</button>
</nav>
<main>
  <h1>Stream catalog</h1>
  <div id="list"><p class="empty">Loading…</p></div>
</main>
<script src="/nexvue/assets/nexvue-portal-auth-gate.js"></script>
<script>
(function () {
  function render(stations) {
    var list = document.getElementById("list");
    list.textContent = "";
    if (!stations.length) {
      var p = document.createElement("p");
      p.className = "empty";
      p.textContent = "No stations visible yet. A NexVUE catalog admin can adopt a station and map your NexAPP group.";
      list.appendChild(p);
      return;
    }
    stations.forEach(function (s) {
      var box = document.createElement("div");
      box.className = "station";
      var h2 = document.createElement("h2");
      h2.textContent = s.name + (s.health === "ok" ? "" : " · " + (s.health || "unknown"));
      box.appendChild(h2);
      var row = document.createElement("div");
      row.className = "channels";
      (s.channels || []).forEach(function (ch) {
        var a = document.createElement("a");
        a.className = "ch-btn";
        a.href = "/nexvue/watch?station=" + encodeURIComponent(s.id) + "&channel=" + encodeURIComponent(ch.channel_base);
        a.textContent = ch.alias || ch.channel_base;
        row.appendChild(a);
      });
      var open = document.createElement("button");
      open.type = "button";
      open.className = "secondary sso";
      open.textContent = "Open station UI";
      open.onclick = function () {
        NexVuePortal.stationSso(s.id).then(function (data) {
          window.open(data.login_url, "_blank", "noopener");
        }).catch(function (e) { alert(e.message || "SSO failed"); });
      };
      row.appendChild(open);
      box.appendChild(row);
      list.appendChild(box);
    });
  }
  NexVuePortal.requirePage().then(function () {
    return NexVuePortal.api("catalog_list");
  }).then(function (data) {
    render(data.stations || []);
  }).catch(function () {});
})();
</script>
</body>
</html>
