# NexVUE cloud portal front door — Apache conf fragment (a2enconf).
# setup.sh --portal substitutes @@APP_ROOT@@ with the real app root (parent
# of public/).
#
# Requires: a2enmod rewrite. Portal site DocumentRoot must be
# @@APP_ROOT@@/public (setup.sh --portal patches enabled vhosts).

<Directory "@@APP_ROOT@@/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    RewriteEngine On
    RewriteBase /
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ index.php [L]

    FallbackResource /index.php
</Directory>
