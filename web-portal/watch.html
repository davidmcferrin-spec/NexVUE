<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Watch</title>
<link rel="stylesheet" href="/nexvue/assets/nexapp-tokens.css">
<link rel="stylesheet" href="/assets/nexapp-theme.css">
<link rel="stylesheet" href="/nexvue/assets/nexvue-portal.css">
<script>
(function () {
  var t = localStorage.getItem("nexapp-theme") || "system";
  var r = t === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : t;
  document.documentElement.setAttribute("data-theme", r);
})();
</script>
<script src="/assets/theme.js" defer></script>
<script src="/nexvue/assets/nexvue-ui.js"></script>
<script src="/nexvue/assets/nexvue-portal-whep.js"></script>
<style>
  .stage {
    width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px;
    border: 1px solid var(--edge); display: flex; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  .state { position: absolute; left: 10px; bottom: 10px; font-size: 12px; padding: 4px 8px; border-radius: 4px; background: rgba(0,0,0,.55); }
  .state.ok { color: var(--ok); }
  .state.bad { color: var(--bad); }
</style>
</head>
<body>
<nav class="topnav">
  <a class="apps-link" href="/portal.php">Apps</a>
  <a href="/nexvue/catalog">← Catalog</a>
  <span class="spacer"></span>
  <span id="nav-who" hidden></span>
  <a href="#" id="nav-logout" hidden>Sign out</a>
  <button type="button" class="theme-toggle" id="theme-toggle">Theme</button>
</nav>
<main>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <div class="state" id="state">connecting…</div>
  </div>
  <h1 id="title">—</h1>
  <div class="meta" id="meta"></div>
</main>
<script src="/nexvue/assets/nexvue-portal-auth-gate.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const stationId = params.get("station") || "";
  const channel = (params.get("channel") || "").toLowerCase();
  const stationName = params.get("name") || "";
  const alias = params.get("alias") || "";
  const video = document.getElementById("video");
  const stateEl = document.getElementById("state");
  let pc = null;

  function setState(text, cls) {
    stateEl.textContent = text;
    stateEl.className = "state" + (cls ? " " + cls : "");
  }

  async function connect() {
    if (!stationId || !/^ch[0-7]$/.test(channel)) {
      setState("missing station/channel", "bad");
      return;
    }
    document.getElementById("title").textContent =
      (stationName || stationId) + " — " + (alias || channel);
    document.getElementById("meta").textContent = "station " + stationId;

    let jwtResp;
    try {
      jwtResp = await NexVuePortal.viewerJwt(stationId, channel);
    } catch (e) {
      setState("not allowed: " + (e.message || "error"), "bad");
      return;
    }

    const iceServers = NexVuePortalWhep.iceServersFrom(jwtResp);
    pc = new RTCPeerConnection(iceServers.length ? { iceServers } : {});
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    pc.ontrack = function (ev) {
      try { ev.receiver.playoutDelayHint = 0; } catch (e) {}
      try { ev.receiver.jitterBufferTarget = 0; } catch (e) {}
      if (!video.srcObject) video.srcObject = ev.streams[0];
    };
    pc.onconnectionstatechange = function () {
      if (!pc) return;
      if (pc.connectionState === "connected") setState("connected", "ok");
      else if (["failed", "disconnected", "closed"].includes(pc.connectionState)) {
        setState(pc.connectionState, "bad");
      }
    };

    try {
      const offer = await pc.createOffer();
      const prepared = await NexVuePortalWhep.prepareWhepOffer(offer);
      await pc.setLocalDescription({ type: "offer", sdp: prepared.sdp });
      await NexVuePortalWhep.waitIceGathering(pc, iceServers.length ? 12000 : 2000);
      let answerSdp;
      if (jwtResp.egress === "sfu") {
        const exchanged = await NexVuePortal.api("sfu_whep", {
          station_id: stationId,
          channel_base: channel,
          sdp: pc.localDescription.sdp,
        });
        answerSdp = exchanged.sdp || "";
      } else {
        const url = jwtResp.whep_url + "?jwt=" + encodeURIComponent(jwtResp.jwt);
        const res = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/sdp" },
          body: pc.localDescription.sdp,
        });
        const body = await res.text();
        if (!res.ok) {
          throw new Error("WHEP endpoint returned " + res.status);
        }
        answerSdp = body;
      }
      await pc.setRemoteDescription({ type: "answer", sdp: answerSdp });
    } catch (err) {
      setState("error: " + (err.message || err), "bad");
    }
  }

  NexVuePortal.requirePage({}).then(function () {
    connect();
  });

  window.addEventListener("beforeunload", function () {
    if (pc) { try { pc.close(); } catch (e) {} }
  });
})();
</script>
</body>
</html>
