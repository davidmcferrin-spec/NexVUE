<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Forgot password</title>
<script src="/assets/nexvue-ui.js"></script>
<style>
  :root {
    --bg: #14181d; --panel: #1d232b; --edge: #2c3542;
    --text: #d6dde6; --dim: #98a6b5; --muted: #b0bbc8;
    --ok: #4cc38a; --bad: #e5484d; --acc: #56c4f5; --on-acc: #08131a;
  }
  html[data-theme="light"] {
    --bg: #f3f5f7; --panel: #ffffff; --edge: #cdd5de;
    --text: #1c232b; --dim: #5a6675; --muted: #3d4a58;
    --ok: #1f9d5c; --bad: #c62828; --acc: #0b7ea4; --on-acc: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 16px;
  }
  .card {
    width: 100%; max-width: 420px; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 6px; padding: 20px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; color: var(--acc); }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; font: inherit;
  }
  button.primary {
    margin-top: 16px; width: 100%; background: var(--acc); color: var(--on-acc);
    border: none; border-radius: 4px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .msg { color: var(--ok); font-size: 12px; margin-top: 10px; }
  .links { margin-top: 14px; font-size: 12px; }
  .links a { color: var(--acc); text-decoration: none; }
  .theme-toggle {
    position: fixed; top: 12px; right: 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--edge); border-radius: 4px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle">Light</button>
<div class="card">
  <h1>Forgot password</h1>
  <p class="sub">Enter your username or email. If an account matches, a reset is created. When email is configured it is sent; otherwise ask an admin to copy a reset link from Users.</p>
  <form id="form">
    <label for="identity">Username or email</label>
    <input id="identity" required autocomplete="username">
    <button type="submit" class="primary">Request reset</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="links"><a href="/login">Back to login</a></div>
</div>
<script src="/assets/nexvue-auth-gate.js"></script>
<script>
document.getElementById("form").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  const msg = document.getElementById("msg");
  msg.textContent = "";
  try {
    const data = await NexVueAuth.api("forgot", {
      username_or_email: document.getElementById("identity").value,
    });
    msg.textContent = data.message || "If an account matches, a reset was created.";
  } catch (e) {
    msg.textContent = "If an account matches, a reset was created.";
  }
});
</script>
</body>
</html>
