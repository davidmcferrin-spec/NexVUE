# NexVUE station TLS — default cert/key for all SSL vhosts unless a site
# overrides SSLCertificateFile / SSLCertificateKeyFile.
# setup.sh installs to /etc/apache2/conf-available/nexvue-ssl-certs.conf
# and a2enconf's it. Certs live under /etc/nexvue/tls/ (shared with MediaMTX).

<IfModule mod_ssl.c>
    SSLCertificateFile      /etc/nexvue/tls/fullchain.pem
    SSLCertificateKeyFile   /etc/nexvue/tls/privkey.pem
</IfModule>
