# NexVUE front door — Apache conf fragment (a2enconf).
# setup.sh substitutes @@APP_ROOT@@ with the real app root (parent of public/).
#
# Requires: a2enmod rewrite. Main site DocumentRoot must be
# @@APP_ROOT@@/public (setup.sh patches enabled vhosts).
# JWKS loopback vhost keeps DocumentRoot at @@APP_ROOT@@ (Require local).

<Directory "@@APP_ROOT@@/public">
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php

    # Path front controller: existing files (assets/) are served directly;
    # everything else goes to public/index.php → nexvue-web-router.php.
    RewriteEngine On
    RewriteBase /
    RewriteCond %{REQUEST_FILENAME} -f [OR]
    RewriteCond %{REQUEST_FILENAME} -d
    RewriteRule ^ - [L]
    RewriteRule ^ index.php [L]

    # Belt-and-suspenders if a request still misses (mod_dir).
    FallbackResource /index.php
</Directory>
