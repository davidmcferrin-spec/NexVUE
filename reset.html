<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Reset password</title>
<script src="nexvue-ui.js"></script>
<style>
  :root {
    --bg: #14181d; --panel: #1d232b; --edge: #2c3542;
    --text: #d6dde6; --dim: #98a6b5; --muted: #b0bbc8;
    --ok: #4cc38a; --bad: #e5484d; --acc: #56c4f5; --on-acc: #08131a;
  }
  html[data-theme="light"] {
    --bg: #f3f5f7; --panel: #ffffff; --edge: #cdd5de;
    --text: #1c232b; --dim: #5a6675; --muted: #3d4a58;
    --ok: #1f9d5c; --bad: #c62828; --acc: #0b7ea4; --on-acc: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 6px; padding: 20px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; color: var(--acc); }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; font: inherit;
  }
  button.primary {
    margin-top: 16px; width: 100%; background: var(--acc); color: var(--on-acc);
    border: none; border-radius: 4px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
  }
  .err { color: var(--bad); font-size: 12px; margin-top: 10px; }
  .ok { color: var(--ok); font-size: 12px; margin-top: 10px; }
  .links { margin-top: 14px; font-size: 12px; }
  .links a { color: var(--acc); text-decoration: none; }
  .theme-toggle {
    position: fixed; top: 12px; right: 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--edge); border-radius: 4px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
</style>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle">Light</button>
<div class="card">
  <h1>Reset password</h1>
  <p class="sub">Set a new password using your one-time reset link.</p>
  <form id="form">
    <label for="pw">New password (min 8)</label>
    <input id="pw" type="password" autocomplete="new-password" required minlength="8">
    <label for="pw2">Confirm</label>
    <input id="pw2" type="password" autocomplete="new-password" required minlength="8">
    <button type="submit" class="primary">Save password</button>
    <div class="err" id="err"></div>
    <div class="ok" id="ok"></div>
  </form>
  <div class="links"><a href="/login.html">Back to login</a></div>
</div>
<script src="nexvue-auth-gate.js"></script>
<script>
(function () {
  const token = new URLSearchParams(location.search).get("token") || "";
  if (!token) {
    document.getElementById("err").textContent = "Missing reset token.";
  }
  document.getElementById("form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    const err = document.getElementById("err");
    const ok = document.getElementById("ok");
    err.textContent = "";
    ok.textContent = "";
    const a = document.getElementById("pw").value;
    const b = document.getElementById("pw2").value;
    if (a !== b) { err.textContent = "passwords do not match"; return; }
    try {
      await NexVueAuth.api("reset", { token: token, password: a });
      ok.textContent = "Password updated. You can sign in.";
      setTimeout(function () { location.href = "/login.html"; }, 1200);
    } catch (e) {
      err.textContent = e.message || "reset failed";
    }
  });
})();
</script>
</body>
</html>
