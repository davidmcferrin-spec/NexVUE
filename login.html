<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NexVUE — Login</title>
<script src="nexvue-ui.js"></script>
<style>
  :root {
    --bg: #14181d; --panel: #1d232b; --edge: #2c3542;
    --text: #d6dde6; --dim: #98a6b5; --muted: #b0bbc8;
    --ok: #4cc38a; --bad: #e5484d; --acc: #56c4f5; --on-acc: #08131a;
  }
  html[data-theme="light"] {
    --bg: #f3f5f7; --panel: #ffffff; --edge: #cdd5de;
    --text: #1c232b; --dim: #5a6675; --muted: #3d4a58;
    --ok: #1f9d5c; --bad: #c62828; --acc: #0b7ea4; --on-acc: #ffffff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text);
    font: 14px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace;
    padding: 16px;
  }
  .card {
    width: 100%; max-width: 380px; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 6px; padding: 20px;
  }
  h1 { margin: 0 0 4px; font-size: 18px; color: var(--acc); }
  .sub { color: var(--dim); font-size: 12px; margin: 0 0 16px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--edge); border-radius: 4px; padding: 8px 10px; font: inherit;
  }
  input:focus { outline: none; border-color: var(--acc); }
  button.primary {
    margin-top: 16px; width: 100%; background: var(--acc); color: var(--on-acc);
    border: none; border-radius: 4px; padding: 10px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.05); }
  .err { color: var(--bad); font-size: 12px; margin-top: 10px; min-height: 1.2em; }
  .links { margin-top: 14px; font-size: 12px; }
  .links a { color: var(--acc); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  .theme-toggle {
    position: fixed; top: 12px; right: 12px; background: var(--panel); color: var(--text);
    border: 1px solid var(--edge); border-radius: 4px; padding: 6px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  #change-box { display: none; }
  #change-box.show { display: block; }
  #login-box.hide { display: none; }
</style>
</head>
<body>
<button type="button" class="theme-toggle" id="theme-toggle">Light</button>
<div class="card">
  <h1>NexVUE</h1>
  <p class="sub" id="subtitle">Sign in to continue</p>

  <div id="login-box">
    <form id="login-form" autocomplete="on">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="primary">Sign in</button>
      <div class="err" id="login-err"></div>
    </form>
    <div class="links"><a href="/forgot.html">Forgot password?</a></div>
  </div>

  <div id="change-box">
    <form id="change-form">
      <label for="cur">Current password</label>
      <input id="cur" type="password" autocomplete="current-password" required>
      <label for="nw">New password (min 8)</label>
      <input id="nw" type="password" autocomplete="new-password" required minlength="8">
      <label for="nw2">Confirm new password</label>
      <input id="nw2" type="password" autocomplete="new-password" required minlength="8">
      <button type="submit" class="primary">Update password</button>
      <div class="err" id="change-err"></div>
    </form>
  </div>
</div>
<script src="nexvue-auth-gate.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const next = params.get("next") || "/index.html";
  const forceChange = params.get("change") === "1";

  function showChange(msg) {
    document.getElementById("login-box").classList.add("hide");
    document.getElementById("change-box").classList.add("show");
    document.getElementById("subtitle").textContent = msg || "Choose a new password before continuing";
  }

  if (forceChange) showChange();

  // If already logged in and no forced change, go next.
  NexVueAuth.me().then(function (u) {
    if (u && u.must_change_password) showChange("Default password must be changed");
    else if (u && !forceChange) location.href = next;
  }).catch(function () {});

  document.getElementById("login-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    const err = document.getElementById("login-err");
    err.textContent = "";
    try {
      const data = await NexVueAuth.api("login", {
        username: document.getElementById("username").value,
        password: document.getElementById("password").value,
      });
      const u = data.user;
      if (u && u.must_change_password) {
        showChange("Default password must be changed");
        return;
      }
      location.href = next;
    } catch (e) {
      err.textContent = e.message || "login failed";
    }
  });

  document.getElementById("change-form").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    const err = document.getElementById("change-err");
    err.textContent = "";
    const a = document.getElementById("nw").value;
    const b = document.getElementById("nw2").value;
    if (a !== b) { err.textContent = "passwords do not match"; return; }
    try {
      await NexVueAuth.api("change_password", {
        current_password: document.getElementById("cur").value,
        new_password: a,
      });
      location.href = next;
    } catch (e) {
      err.textContent = e.message || "update failed";
    }
  });
})();
</script>
</body>
</html>
