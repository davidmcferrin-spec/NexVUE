# NexVUE — loopback-only JWKS for MediaMTX (avoids HTTPS redirect on :80).
# MediaMTX fetches http://127.0.0.1:9080/nexvue-jwks.php once and caches keys.
Listen 127.0.0.1:9080
<VirtualHost 127.0.0.1:9080>
    ServerName nexvue-jwks.local
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require local
    </Directory>
</VirtualHost>
